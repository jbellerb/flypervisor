app = 'flypervisor'
primary_region = 'iad'

machine_config = '''{
  "containers": [
    {
      "name": "app",
      "image": "placeholder",
      "secrets": [{ "env_var": "BOOTSTRAP_SSH_PUBKEY" }]
    }
  ]
}'''
container = 'app'
kill_timeout = 15

[env]
  DIST = 'ubuntu'
  RELEASE = 'resolute'

[build]

[mounts]
  source = 'data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 22
  auto_stop_machines = 'off'
  auto_start_machines = false
  processes = ['app']

  [[services.ports]]
    port = 22
    handlers = []

[[vm]]
  cpu_kind = 'performance'
  cpus = 16
  memory_mb = 65536
